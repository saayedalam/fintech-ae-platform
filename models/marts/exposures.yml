version: 2

exposures:
  - name: delinquency_dashboard
    type: dashboard
    maturity: medium
    url: https://github.com/saayedalam/fintech-ae-platform/blob/main/powerbi/fintech-ae-powerbi.pbix
    description: >
      Power BI dashboard summarizing loan-month volume and delinquency rates
      across reporting month, property state, and origination channel, with
      mortgage rates available as macroeconomic context.

    owner:
      name: Saayed Alam
      email: saayedalam@gmail.com

    config:
      tags: ["bi", "dashboard", "risk"]
      meta:
        domain: "mortgage_risk"
        audience: "risk_leadership"

    depends_on:
      - ref('fct_delinquency_monthly')
